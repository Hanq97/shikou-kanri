services:
  postgres:
    image: postgres:16-alpine
    container_name: shikou-kanri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shikou
      POSTGRES_PASSWORD: shikou_dev_password
      POSTGRES_DB: shikou_kanri_dev
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shikou -d shikou_kanri_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shikou-kanri-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: shikou-kanri-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    logging:
      driver: 'none'

volumes:
  postgres-data:
  redis-data:
